name: 🐛 Bug report / 버그 신고
description: The skill, the engine or the leaderboard does not work as documented. / 스킬·엔진·순위표가 문서대로 동작하지 않을 때
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste a private agent spec or API key here. / 비공개 명세나 API 키는 붙여 넣지 마세요.
        A score you disagree with is not a bug by itself: interviews are graded by models. / 점수가 마음에 들지 않는 것만으로는 버그가 아닙니다. 채점은 모델이 합니다.
  - type: textarea
    id: what
    attributes:
      label: What happened / 무슨 일이 있었나요
      description: What you expected, and what happened instead. Include the error JSON if there was one. / 기대한 동작과 실제 동작, 오류 JSON 이 있으면 함께
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 재현 방법
      placeholder: "/arena:apply --quick ./my-agent.md"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Arena version / 아레나 버전
      description: From the plugin list or the result JSON (`arenaVersion`). / 플러그인 목록이나 결과 JSON 의 `arenaVersion`
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend / 백엔드
      options:
        - claude CLI
        - ANTHROPIC_API_KEY
        - Not sure / 모름
    validations:
      required: true
  - type: input
    id: issue
    attributes:
      label: Related submission issue (if any) / 관련 제출 Issue 번호 (있으면)
      placeholder: "#12"
