# 순위표 제출 처리.
# Issue 가 열릴 때(그 Issue 를 먼저), 그리고 15분마다 열린 [arena-submission] Issue 를 모두 처리한다.
# 실행이 몰려 대기 중인 실행이 취소되더라도 다음 실행이 남은 Issue 를 줍는다.
# Issue 제목·본문은 신뢰할 수 없는 입력이다. 셸에 ${{ }} 로 끼워 넣지 않고, 처리는 runner/board_cli.ts 가 인자 배열로 gh·git 을 부른다.
# 검증은 모델을 부르지 않는다: 제출물에 실린 지원자 응답으로 판정 인용·출력 계약·공격 편성·탐지기를 코드로 다시 계산한다
# (runner/board.ts recheckEvidence). 면접을 다시 보는 재채점은 API 키와 비용이 들어 넣지 않았다.
# 검증 경로는 npm 의존성이 필요 없어 설치 단계를 두지 않는다 (runner/board_cli.test.ts 가 import 를 확인한다). 쓰기 토큰은 처리 단계의 env 에만 있다.
# 제목 접두어 [arena-submission] 은 runner/board_cli.ts 의 TITLE_PREFIX 와 같아야 한다.
name: leaderboard

on:
  issues:
    types: [opened]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  sweep:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[arena-submission]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          # 토큰을 .git/config 에 남기지 않는다. push 인증은 처리 단계에서만 gh auth setup-git 으로 건다
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Bundle prompts
        run: node runner/bundle_assets.ts

      - name: Process submissions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # 숫자라 셸에 끼워 넣어도 안전하지만, 다른 값과 같은 방식으로 env 로만 넘긴다
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "arena-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          node runner/board_cli.ts sweep
